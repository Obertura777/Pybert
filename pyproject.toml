[project]
name = "albert"
version = "0.1.0"
description = "Source-faithful Python port of the Albert DAIDE Diplomacy bot"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "diplomacy",
    "pytest>=9.0.3",
]

[tool.uv.sources]
diplomacy = { git = "https://github.com/ALLAN-DIP/diplomacy.git", rev = "dev" }

[tool.ty.rules]
unresolved-import = "ignore"
